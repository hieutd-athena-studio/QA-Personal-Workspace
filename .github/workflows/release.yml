name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required so electron-builder can upload artifacts to the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # pnpm test rebuilds better-sqlite3 for the Node ABI. Switch it back to the
      # Electron ABI before electron-builder packages the .app, otherwise the
      # production app crashes at startup on `require('better-sqlite3')` and the
      # main window never shows.
      - run: pnpm rebuild:electron

      - run: pnpm build

      - name: Build & publish
        shell: bash
        # When no signing secrets are configured, GitHub injects empty strings for them.
        # Empty CSC_LINK confuses electron-builder ("not a file" error) so unset them
        # and let electron-builder skip its native signing pipeline. The `afterPack`
        # hook in electron-builder.yml then re-signs the entire bundle ad-hoc with
        # `codesign --deep --force --sign -` so the Electron Framework and the outer
        # wrapper share the same (empty) Team ID — required by macOS 14+ dyld.
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No macOS code-signing certs configured — afterPack hook will ad-hoc sign"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing — add these secrets in GitHub repo settings before first signed release
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing — deferred. Add WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD here when ready.
