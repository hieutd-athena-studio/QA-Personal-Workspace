name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required so electron-builder can upload artifacts to the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Build & publish
        shell: bash
        # If signing secrets aren't configured the env vars arrive as empty strings,
        # and electron-builder tries to read `""` as a cert file (`not a file` error).
        # Unset them and force ad-hoc signing of every nested binary (mac.identity='-')
        # so the outer app + Electron Framework share the same (empty) Team ID.
        # Without `--config.mac.identity=-` the outer wrapper is ad-hoc signed but the
        # bundled Electron Framework keeps Apple's signature → macOS dyld refuses to
        # load with "different Team IDs".
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No macOS code-signing certs configured — building ad-hoc signed"
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            pnpm exec electron-builder --publish always --config.mac.identity=-
          else
            pnpm exec electron-builder --publish always
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing — add these secrets in GitHub repo settings before first signed release
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code-signing — deferred. Add WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD here when ready.
